.fog{animation:fog 12s linear infinite alternate}@keyframes fog{to{transform:translateX(18%)}}
.flame{animation:fl .25s ease-in-out infinite alternate;transform-origin:50% 100%}@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}

<script>
const $=id=>document.getElementById(id),S=[1,2,3,4,5,6].map(n=>$('s'+n));
const st=$('stage'),c=$('fx'),g=c.getContext('2d');let W,H,P=[],T=[],dust=false,petals=false,hearts=false;
function rs(){const r=devicePixelRatio||1;W=st.clientWidth;H=st.clientHeight;c.width=W*r;c.height=H*r;g.setTransform(r,0,0,r,0,0)}rs();addEventListener('resize',rs);
const R=(a,b)=>a+Math.random()*(b-a);
function spawn(k){
 if(k=='d')P.push({k,x:R(0,W),y:R(0,H),vx:R(-.15,.15),vy:R(-.4,-.1),l:R(120,260),s:R(.8,2.4),a:0});
 if(k=='p')P.push({k,x:R(0,W),y:-20,vx:R(-.5,.5),vy:R(.8,1.8),l:600,s:R(6,11),r:R(0,6),vr:R(-.05,.05),c:Math.random()<.6?'#b3122c':'#e0455f'});
 if(k=='h')P.push({k,x:R(0,W),y:H+20,vx:R(-.3,.3),vy:R(-1.8,-.8),l:400,s:R(14,28),c:Math.random()<.5?'❤️':'🖤'});
}
function burst(x,y){const col=['#ffd76a','#fff1b8','#ff6b8b','#ffffff'];for(let i=0;i<70;i++){const a=i/70*6.283,v=R(1.5,4.2);P.push({k:'f',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(50,85),m:85,s:2,c:col[i%4]})}}
function loop(){g.clearRect(0,0,W,H);
 if(dust&&Math.random()<.6)spawn('d');if(petals&&Math.random()<.18)spawn('p');if(hearts&&Math.random()<.08)spawn('h');
 P=P.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.l--;
  if(p.k=='d'){const a=Math.min(1,p.l/60)*.9;g.fillStyle=`rgba(255,215,110,${a})`;g.shadowColor='#ffcc55';g.shadowBlur=8;g.beginPath();g.arc(p.x,p.y,p.s,0,7);g.fill();g.shadowBlur=0}
  else if(p.k=='p'){p.r+=p.vr;p.x+=Math.sin(p.y/30);g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.beginPath();g.ellipse(0,0,p.s,p.s*.55,0,0,7);g.fill();g.restore()}
  else if(p.k=='h'){g.globalAlpha=Math.min(1,p.l/80);g.font=p.s+'px serif';g.fillText(p.c,p.x,p.y);g.globalAlpha=1}
  else{p.vy+=.04;g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.shadowColor=p.c;g.shadowBlur=6;g.fillRect(p.x,p.y,p.s,p.s);g.shadowBlur=0;g.globalAlpha=1}
  return p.l>0&&p.y<H+40});
 requestAnimationFrame(loop)}loop();

/* Uploaded song: the old synthesized soundtrack has been removed. */
 const song=$('birthdaySong');
 function music(){song.volume=0.9;const p=song.play();if(p&&p.catch)p.catch(()=>{$('ov').style.display='block'});}

 /* timeline */
const L=["Happy 23rd Birthday, Akshita, My Love ❤️","You are the most beautiful part of my life.","May your smile always shine brighter than the stars.","You deserve all the happiness, love, and success in this world.","Forever grateful to have you in my life. I love you so much! ❤️🖤<br><span class='serif italic text-xl text-amber-200'>— Yash</span>"];
function show(n){S.forEach((s,i)=>s.classList.toggle('on',i==n))}
function at(s,f){T.push(setTimeout(f,s*1000))}
function play(){
 T.forEach(clearTimeout);T=[];P=[];dust=true;petals=hearts=false;t0=performance.now();
 
 $('fin').innerHTML=$('fin').innerHTML;
 $('lines').innerHTML=L.map((t,i)=>`<p class="line ${i?'serif italic text-2xl leading-snug text-amber-50':'script gold text-5xl leading-tight'} absolute inset-x-0 top-1/2 -translate-y-1/2">${t}</p>`).join('');
 show(0);
 at(6,()=>show(1));
 at(12,()=>{show(2);petals=true});
 at(18,()=>{show(3);bals()});
 at(25,()=>{show(4);petals=false});
 [...Array(5)].forEach((_,i)=>{at(25.6+i*2.05,()=>{const ls=[...$('lines').children];ls.forEach(l=>l.classList.remove('in'));ls[i].classList.add('in')})});
 at(36,()=>{show(5);hearts=true;petals=true;let n=0;const f=()=>{burst(R(W*.15,W*.85),R(H*.08,H*.4));if(++n<9)T.push(setTimeout(f,R(500,1000)))};f()});
 at(47,()=>play());
 (function pr(){const e=(performance.now()-t0)/47000;$('bar').style.width=Math.min(100,e*100)+'%';if(e<1)requestAnimationFrame(pr)})();
}
function bals(){const b=$('bals');b.innerHTML='';for(let i=0;i<9;i++){const d=document.createElement('i');d.className='bal absolute rounded-full';const s=R(40,64);d.style.cssText=`left:${R(2,92)}%;bottom:-80px;width:${s}px;height:${s*1.2}px;animation-delay:${R(0,5)}s;animation-duration:${R(7,11)}s;background:radial-gradient(circle at 30% 30%,${i%2?'#fff3b0,#c9a13b 45%,#6b4e10':'#444,#0c0c0c 50%,#000'});box-shadow:0 0 14px rgba(240,190,70,.35)`;b.appendChild(d)}}
music();play();
const hint=$('ov');
function wake(){ac.resume();hint.style.display='none'}
['pointerdown','touchstart','keydown'].forEach(e=>addEventListener(e,wake,{once:true}));
setTimeout(()=>{if(ac.state!='running')hint.style.display='block'},400);
</script>
